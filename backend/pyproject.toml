[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "better-network-tools"
version = "0.1.0"
description = "Cross-platform network engineering tools with a FastAPI backend."
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Erich Brinkman" },
]
keywords = ["networking", "diagnostics", "scanner", "ssh", "file-transfer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Networking",
]
dependencies = [
  "asyncssh>=2.24,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "mac-vendor-lookup>=0.1.15,<0.2",
  "pydantic>=2.9,<3.0",
  "pyftpdlib>=2.2,<3.0",
  "uvicorn[standard]>=0.52.3,<1.0",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.10,<3.0",
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "setuptools>=83,<84",
  "uv==0.11.31",
]

[project.scripts]
better-network-tools-api = "better_network_tools.main:run"

[project.urls]
Homepage = "https://better-network-tools-suite.erichbrinkman.chatgpt.site"
Repository = "https://github.com/erichbrinkman/betternetworktools"
Documentation = "https://github.com/erichbrinkman/betternetworktools/tree/main/docs"
Issues = "https://github.com/erichbrinkman/betternetworktools/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
